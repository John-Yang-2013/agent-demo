[project]
name = "agent-demo"
version = "0.1.0"
description = "A multi-tool ReAct AI agent built with LangChain + LangGraph + Ollama, running a local LLM."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "agent-demo" }]

dependencies = [
    "langchain>=1.0,<2.0",
    "langchain-core>=1.0,<2.0",
    "langchain-ollama>=1.0,<2.0",
    "langgraph>=1.0,<2.0",
    "requests>=2.31,<3.0",
    "wikipedia>=1.4,<2.0",
    "rich>=13.7,<15.0",
    "python-dotenv>=1.0,<2.0",
    "pydantic>=2.0,<3.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6,<1.0",
    "black>=24.0,<26.0",
    "mypy>=1.10,<2.0",
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<7.0",
]

# --------------------------------------------------------------------------- #
# Ruff — linter & formatter
# --------------------------------------------------------------------------- #
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["__pycache__"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "C4",   # flake8-comprehensions
    "TID",  # flake8-tidy-imports
]
ignore = [
    "E501",  # line too long (handled by black/formatter)
    "B008",  # function calls in default args (used by @tool pattern in places)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]  # assert False is fine in tests

[tool.ruff.lint.isort]
known-first-party = ["agent"]

# --------------------------------------------------------------------------- #
# Black — formatter
# --------------------------------------------------------------------------- #
[tool.black]
line-length = 100
target-version = ["py312"]

# --------------------------------------------------------------------------- #
# Mypy — type checker
# --------------------------------------------------------------------------- #
[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
ignore_missing_imports = true
# LangChain tool decorators return complex typed objects; relax strictness for now.
check_untyped_defs = true
exclude = ["build/", "dist/"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

# --------------------------------------------------------------------------- #
# Pytest
# --------------------------------------------------------------------------- #
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra -q"
